{% extends "base.html" %}
{% block title %}Create Template{% endblock %}
{% block content %}
<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><i class="fas fa-file-alt"></i> Create Email Template</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Template Name *</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject *</label>
                        <input type="text" class="form-control" name="subject" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">HTML Body *</label>
                        <textarea class="form-control" name="body_html" rows="8" required placeholder="<h1>Hello {{name}}</h1><p>Click <a href='{{link}}'>here</a></p>"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Plain Text Body</label>
                        <textarea class="form-control" name="body_text" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Template</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
