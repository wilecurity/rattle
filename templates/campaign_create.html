{% extends "base.html" %}

{% block title %}Create Campaign{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-plus-circle"></i> Create New Campaign
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Campaign Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="client_id" class="form-label">Google Client ID *</label>
                        <input type="text" class="form-control" id="client_id" name="client_id" required>
                        <small class="form-text text-muted">From Google Cloud Console > Credentials</small>
                    </div>
                    <div class="mb-3">
                        <label for="client_secret" class="form-label">Google Client Secret *</label>
                        <input type="password" class="form-control" id="client_secret" name="client_secret" required>
                    </div>
                    <div class="mb-3">
                        <label for="redirect_uri" class="form-label">Redirect URI</label>
                        <input type="url" class="form-control" id="redirect_uri" name="redirect_uri" value="http://localhost:8000/callback">
                    </div>
                    <div class="mb-3">
                        <label for="scopes" class="form-label">Scopes</label>
                        <textarea class="form-control" id="scopes" name="scopes" rows="3">openid profile email https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/drive.readonly</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-rocket"></i> Create Campaign
                    </button>
                    <a href="{{ url_for('campaigns') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
